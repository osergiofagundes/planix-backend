services:
  db:
    ports: !override
      - "127.0.0.1:5434:5432"                # 5433 e da producao
    restart: "no"                             # dev nunca sobe sozinho no boot

  app:
    image: maven:3.9-eclipse-temurin-21     # anula o build da imagem de produção
    build: !reset null
    working_dir: /workspace
    command: mvn -B spring-boot:run
    environment:
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      # Liga o db/seed/ no Flyway. O seed APAGA o banco de dev e o repovoa —
      # veja o cabecalho do R__seed_dev.sql. Producao nao define esta variavel.
      SPRING_PROFILES_ACTIVE: "dev"
    ports: !override
      - "127.0.0.1:8081:8080"                # 8080 e da producao
    restart: "no"
    volumes:
      - .:/workspace                        # o projeto do host, dentro do container
      - planix_m2:/root/.m2                 # cache do Maven entre execuções
      - planix_uploads:/data/uploads

volumes:
  planix_m2:
    # Cache do Maven compartilhado entre projetos Compose: o stack de dev roda
    # com -p planix-dev, que senao criaria um cache vazio e rebaixaria todas as
    # dependencias. "external" evita o aviso de volume criado por outro
    # projeto; o scripts/dev-up.ps1 garante que ele exista.
    name: planix_planix_m2
    external: true

# Rede propria. Se o dev entrasse na planix-net, existiriam DOIS containers com
# o alias "app" e o nginx de producao passaria a sortear entre prod e dev.
networks:
  default:
    name: planix-dev-net
