spring.application.name=planix

# Conexão com o PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/planix
spring.datasource.username=planix
spring.datasource.password=planix

# O Flyway é o dono do schema; o Hibernate só valida se as entidades batem
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway (habilitado por padrão; deixamos explícito para estudo)
spring.flyway.enabled=true

# Limites de upload (usados no capítulo de anexos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Pasta onde os anexos serão salvos
planix.upload-dir=./uploads

planix.jwt.secret=${PLANIX_JWT_SECRET:troque-este-segredo-de-desenvolvimento-com-32-chars}
planix.jwt.access-ttl=15m
planix.jwt.refresh-ttl=7d

# Aceita várias separadas por vírgula.
planix.cors.allowed-origins=http://localhost:5173

# Documentação da API. São duas coisas diferentes:
# o springdoc GERA a especificação OpenAPI e a publica em /v3/api-docs;
# o Scalar só DESENHA aquela especificação, em /scalar.
springdoc.api-docs.path=/v3/api-docs
springdoc.default-produces-media-type=application/json

scalar.path=/scalar
scalar.page-title=Planix API
# Mantém o token colado no botão de autenticação entre recarregamentos da página
scalar.persist-auth=true
scalar.telemetry=false