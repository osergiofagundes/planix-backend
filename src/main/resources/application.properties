spring.application.name=planix

spring.datasource.url=jdbc:postgresql://localhost:5433/planix
spring.datasource.username=planix
spring.datasource.password=planix

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

planix.upload-dir=./uploads

planix.jwt.secret=${PLANIX_JWT_SECRET:troque-este-segredo-de-desenvolvimento-com-32-chars}
planix.jwt.access-ttl=15m
planix.jwt.refresh-ttl=7d

planix.cors.allowed-origins=http://localhost:5173,http://localhost:5174

springdoc.api-docs.path=/v3/api-docs
springdoc.default-produces-media-type=application/json

scalar.path=/scalar
scalar.page-title=Planix API
scalar.persist-auth=true
scalar.telemetry=false

planix.outbox.relay.enabled=true
planix.outbox.relay.interval=2s
planix.outbox.relay.batch=100
planix.outbox.retention-days=7
planix.due-scan.enabled=true

spring.kafka.bootstrap-servers=${PLANIX_KAFKA_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=5000

planix.notifications.topic=planix.notifications.v1
