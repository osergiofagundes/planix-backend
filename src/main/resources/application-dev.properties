# Profile de DESENVOLVIMENTO. Existe por um motivo só: ligar o seed.
#
# O Flyway passa a enxergar db/seed/ além de db/migration/. É lá que mora o
# R__seed_dev.sql, que APAGA o banco e o repovoa com dados de teste. Produção
# não ativa profile nenhum (veja o compose.yaml), então nunca carrega esta pasta.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# Salvaguarda: o default do application.properties é a 5433 — o banco de
# PRODUÇÃO. Quem roda a aplicação na mão com este profile está pedindo o seed,
# e o seed não pode nem tropeçar na produção. Dentro do container isto é
# inócuo: o SPRING_DATASOURCE_URL do Compose tem precedência maior.
spring.datasource.url=jdbc:postgresql://localhost:5434/planix
