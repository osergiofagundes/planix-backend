services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: planix
      POSTGRES_USER: planix
      POSTGRES_PASSWORD: planix
    ports:
      # Preso ao 127.0.0.1: acessivel pelo DBeaver/IDE, invisivel na rede local.
      - "127.0.0.1:5433:5432"
    volumes:
      - planix_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planix -d planix"]
      interval: 5s
      timeout: 5s
      retries: 10
    # "always" (e nao "unless-stopped") para o banco voltar sozinho junto com o
    # Docker Desktop quando o PC liga.
    restart: always

  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/planix
      SPRING_DATASOURCE_USERNAME: planix
      SPRING_DATASOURCE_PASSWORD: planix
      PLANIX_UPLOAD_DIR: /data/uploads
      # O ":?" faz o Compose RECUSAR subir se a variavel nao existir no ambiente (ou no .env).
      # Mesmo principio do WeakKeyException do jjwt: melhor falhar na subida do que rodar com o
      # segredo que esta publicado no repositorio.
      PLANIX_JWT_SECRET: ${PLANIX_JWT_SECRET:?defina esta variavel (veja o .env.example)}
      # O broker vive no stack do ../planix-realtime, que sobe DEPOIS deste (ele consome a
      # planix-net como external). Ate la o relay so acumula na outbox, sem quebrar nada.
      PLANIX_KAFKA_SERVERS: kafka:9092
    ports:
      # Em producao o navegador NAO usa esta porta: o nginx do frontend faz
      # proxy de /api. Ela fica publicada so para o Scalar (/scalar) e para
      # depuracao, presa ao 127.0.0.1.
      - "127.0.0.1:8080:8080"
    volumes:
      - planix_uploads:/data/uploads
    restart: always

volumes:
  planix_pgdata:
  planix_uploads:

# Rede compartilhada com o stack do planix-frontend-2, para o nginx conseguir
# resolver o nome "app" e fazer proxy de /api. Sem "external": este stack e o
# dono e cria a rede; o frontend a consome como external.
networks:
  default:
    name: planix-net